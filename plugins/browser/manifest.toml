id = "browser"
name = "Browser"
version = "0.3.0"
description = "Operate a private persistent Chromium browser through Playwright."

[capabilities]
network = ["*"]
files = true

[config]
node_path = { type = "string", default = "node" }
module_path = { type = "string", default = "/opt/kest-browser/node_modules/playwright" }
headless = { type = "bool", default = true }
sandbox = { type = "bool", default = true }
timeout_seconds = { type = "int", default = 30 }
max_chars = { type = "int", default = 12000 }

[[tools]]
name = "navigate_page"
risk = "write"

[[tools]]
name = "read_page"
risk = "read"

[[tools]]
name = "scroll_page"
risk = "read"

[[tools]]
name = "find_text"
risk = "read"

[[tools]]
name = "click_element"
risk = "write"

[[tools]]
name = "click_position"
risk = "write"

[[tools]]
name = "fill_field"
risk = "write"

[[tools]]
name = "press_key"
risk = "write"

[[tools]]
name = "select_option"
risk = "write"

[[tools]]
name = "hover_element"
risk = "write"

[[tools]]
name = "wait_for"
risk = "read"

[[tools]]
name = "navigate_history"
risk = "write"

[[tools]]
name = "screenshot"
risk = "read"

[[tools]]
name = "upload_file"
risk = "write"

[[tools]]
name = "list_tabs"
risk = "read"

[[tools]]
name = "close_tab"
risk = "read"
