name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint-cli2.yaml"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint-cli2.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Markdown lint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode checks relative links and anchors only. External URLs
          # are skipped so a third-party outage cannot break the build.
          args: --offline --no-progress "**/*.md"
          fail: true
