config:
  default: true
  MD013: false # line length: prose is written one paragraph per line
  MD024:
    siblings_only: true # allow repeated headings under different parents
  MD033: false # inline HTML is allowed in a few places
  MD036: false # bold lead-ins are used deliberately
  MD060: false # table column style is not enforced
ignores:
  - node_modules
  - .claude
