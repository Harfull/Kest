# Copy to <data dir>/config.toml. Environment variables (KEST_*) override this file.
# Secrets are best supplied through the environment instead of this file.

data_dir = "./data"
enabled_plugins = ["reminders", "tasks", "webfetch"]
timezone = "UTC"            # IANA zone, e.g. "Europe/London"

[log]
level = "info"              # debug | info | warn | error
format = "text"             # text | json
sensitive = false           # allow message content in debug logs

[telegram]
# token = ""                # prefer KEST_TELEGRAM_TOKEN
owner_ids = []              # e.g. [123456789]; prefer KEST_OWNER_ID

[llm]
# api_key = ""              # prefer KEST_OPENROUTER_API_KEY
base_url = "https://openrouter.ai/api/v1"
tts_voice = "alloy"
daily_budget_usd = 1.0      # 0 disables the guard
zdr_only = false            # route only to zero-data-retention providers

[llm.models]
general = "google/gemini-3-flash-preview"
fallbacks = []              # e.g. ["provider/model-a", "provider/model-b"]
transcription = "openai/gpt-4o-mini-transcribe"
tts = "openai/gpt-4o-mini-tts-2025-12-15"

[coach]
max_proactive_per_day = 3   # 0 to 20
quiet_start = "23:00"       # used until the sleep model has enough data
quiet_end = "07:00"

# Settings for a plugin go under [plugins.<id>]; they are checked against the
# plugin's manifest. See each plugin's README for its settings.
[plugins.reminders]
max_active = 50

[plugins.tasks]
max_open = 200

[plugins.webfetch]
max_chars = 6000
